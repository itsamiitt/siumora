version: 2
updates:
  # One weekly PR per ecosystem for minor/patch bumps across the workspace;
  # majors arrive individually so each gets read. Security updates are not
  # grouped and open as soon as an advisory is published.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Medusa packages move in lockstep (all pinned to one version); bump
      # them together by hand with the upgrade notes open.
      - dependency-name: "@medusajs/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Launch freeze (plan 18, D6): no majors of the toolchain or of what
      # Medusa 2.21 pins internally until launch + 30 days. MikroORM and
      # awilix are resolved by Medusa's module loader; bumping them on their
      # own breaks it. Security updates still open regardless of this list.
      - dependency-name: "@mikro-orm/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "awilix"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tsup"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
