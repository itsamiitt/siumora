name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first. Nobody reads the result of a run against
# a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A credential that lands in a commit is rotated, not rewritten away — but
  # the cheapest rotation is the one that never happens. Full history so a
  # secret buried ten commits deep still fails the scan.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The database tests are the ones worth having — order state machines,
    # invoice allocation under a lock, the remittance ledger. Running them
    # against a real Postgres is the point; a mock would pass regardless.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siumora
          POSTGRES_PASSWORD: siumora
          POSTGRES_DB: siumora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siumora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://siumora:siumora@localhost:5432/siumora
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter=@siumora/db migrate

      - name: Seed the catalogue
        run: pnpm --filter=@siumora/db seed

      # The storefront prerenders product and collection pages at build time,
      # so the build genuinely needs the API up. Starting it here rather than
      # stubbing the fetch keeps the build honest: a route that would 500 in
      # production fails the build instead of shipping.
      - name: Start the API
        run: |
          pnpm --filter=@siumora/api start > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "api up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "api did not come up"
          cat /tmp/api.log
          exit 1
        env:
          ADMIN_PHONES: "9000000001"
          OTP_ECHO: "true"
          COURIER_SIMULATION: "true"

      - name: Typecheck and test
        run: pnpm turbo run typecheck test

      # The browser truth (plan 6A): a person can buy, the kill-switch reaches
      # the page without a rebuild, the purchase rides the dataLayer once. The
      # suite brings its own database, API and web server on its own ports.
      - name: Install Playwright
        run: pnpm --filter @siumora/e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter @siumora/e2e test:e2e

      - name: E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: apps/e2e/test-results/
          if-no-files-found: ignore

      - name: API log
        if: failure()
        run: cat /tmp/api.log || true

  # Track M (design doc M0): the Medusa app must cold-boot on linux against a
  # fresh database — migrations, config guards, in-memory bus. Runs parallel
  # to `check` because that job already lives at its 20-minute cap with one
  # build inside it. Grows into the full E2E_BACKEND=medusa suite at M1; the
  # two jobs merge at M5.8 (archive), not at cutover — a rollback target
  # without CI is not a rollback target.
  medusa:
    name: Medusa boots + contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siumora
          POSTGRES_PASSWORD: siumora
          POSTGRES_DB: siumora_medusa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siumora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MEDUSA_DATABASE_URL: postgresql://siumora:siumora@localhost:5432/siumora_medusa

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Medusa migrations
        run: pnpm --filter @siumora/medusa db:migrate

      - name: Seed (catalog + serviceability)
        working-directory: apps/medusa
        run: |
          npx medusa exec ./src/scripts/seed.ts
          npx medusa exec ./src/scripts/seed-serviceability.ts

      - name: Boot to /health
        working-directory: apps/medusa
        env:
          # The live-instance posture the contract suite expects (mirrors the
          # local :9101 convention — apps/medusa/README.md): echoed OTPs,
          # no rate limits, courier simulation, the operator allow-list, and
          # placeholder seller details so invoice.pdf can issue.
          OTP_ECHO: "true"
          DISABLE_RATE_LIMITS: "true"
          COURIER_SIMULATION: "true"
          ADMIN_PHONES: "9000000001"
          SELLER_NAME: "Siumora (ci)"
          SELLER_ADDRESS: "1 Marine Drive, Mumbai 400001"
          SELLER_GSTIN: "27ABCDE1234F1Z5"
          SELLER_STATE_CODE: "27"
          SELLER_EMAIL: "ci@siumora.example"
          SELLER_PHONE: "9000000000"
        run: |
          npx medusa develop > /tmp/medusa.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl -sf http://localhost:9000/health > /dev/null; then
              echo "medusa up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "medusa did not come up"
          cat /tmp/medusa.log
          exit 1

      - name: SDK contract, medusa transport
        working-directory: apps/api
        env:
          SDK_CONTRACT_BACKEND: medusa
          MEDUSA_URL: http://localhost:9000
        run: |
          # pg is a dependency of apps/medusa, not apps/api — resolve from there.
          export MEDUSA_PUBLISHABLE_KEY="$(cd ../medusa && node -e "
            const { Client } = require('pg');
            const c = new Client({ connectionString: process.env.MEDUSA_DATABASE_URL });
            c.connect()
              .then(() => c.query(\"SELECT token FROM api_key WHERE type='publishable' AND revoked_at IS NULL LIMIT 1\"))
              .then(r => { console.log(r.rows[0].token); return c.end(); });
          " )"
          node --test --experimental-strip-types src/sdk-contract.test.ts

      - name: Medusa log
        if: failure()
        run: cat /tmp/medusa.log || true
